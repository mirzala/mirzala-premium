<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>Mirzala Premium</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <!-- ==================================================
       MIRZALA PREMIUM APP WRAPPER
       ================================================== -->

  <main id="mirzala-premium-app">

    <!-- ==================================================
         MAIN CARD WRAPPER
         ================================================== -->

    <section class="mp-card">

      <!-- ==================================================
           HEADER WRAPPER
           ================================================== -->

      <header class="mp-header">

        <button
          type="button"
          class="mp-home-button"
          id="mp-home-button"
          aria-label="Go to Mirzala home"
        >
          <span>⌂</span>
        </button>

        <div class="mp-logo">
          mirzala
        </div>

        <div class="mp-sponsored">
          Sponsored
        </div>

      </header>


      <!-- ==================================================
           PRODUCT IMAGE WRAPPER
           ================================================== -->

      <div class="mp-image-wrapper">

        <a
          href="#"
          id="mp-image-link"
          target="_blank"
          rel="noopener noreferrer"
        >

          <img
            id="mp-product-image"
            src=""
            alt=""
          >

        </a>

      </div>


      <!-- ==================================================
           PRODUCT CONTROLS WRAPPER
           ================================================== -->

      <div class="mp-controls">

        <button
          type="button"
          id="mp-next-button"
          class="mp-control-button"
          aria-label="Next product"
        >
          <span>⌃</span>
        </button>


        <button
          type="button"
          id="mp-share-button"
          class="mp-control-button mp-share-button"
          aria-label="Share product"
        >
          <span>↗</span>
        </button>


        <button
          type="button"
          id="mp-prev-button"
          class="mp-control-button"
          aria-label="Previous product"
        >
          <span>⌄</span>
        </button>

      </div>


      <!-- ==================================================
           PRODUCT INFORMATION WRAPPER
           ================================================== -->

      <article class="mp-product-info">

        <h1 id="mp-product-title">
          Loading...
        </h1>

        <p id="mp-product-description">
          Loading product...
        </p>

      </article>


      <!-- ==================================================
           CTA WRAPPER
           ================================================== -->

      <div class="mp-cta-wrapper">

        <a
          href="#"
          id="mp-cta-button"
          class="mp-cta-button"
          target="_blank"
          rel="noopener noreferrer"
        >
          Check It Out →
        </a>

      </div>


      <!-- ==================================================
           DISCLOSURE WRAPPER
           ================================================== -->

      <footer class="mp-disclosure">

        <div>
          <span>*</span>
          mirzala is reader-supported. Featured products may include affiliate links.
        </div>

        <div>
          See our
          <a
            href="https://www.mirzala.com/p/affiliate-disclosure.html"
            target="_blank"
            rel="noopener noreferrer"
          >
            Affiliate Disclosure
          </a>.
        </div>

      </footer>

    </section>


    <!-- ==================================================
         SHARE MODAL WRAPPER
         ================================================== -->

    <div
      id="mp-share-overlay"
      class="mp-share-overlay"
      aria-hidden="true"
    >

      <div class="mp-share-modal">

        <button
          type="button"
          id="mp-share-close"
          class="mp-share-close"
          aria-label="Close"
        >
          ×
        </button>

        <h2>
          Share this product
        </h2>

        <p>
          Share this Mirzala product with someone.
        </p>


        <div class="mp-share-actions">

          <button
            type="button"
            id="mp-whatsapp-button"
            class="mp-share-action"
          >
            WhatsApp
          </button>


          <button
            type="button"
            id="mp-copy-button"
            class="mp-share-action"
          >
            Copy Link
          </button>

        </div>


        <div
          id="mp-copy-status"
          class="mp-copy-status"
        ></div>

      </div>

    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>
